<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdenMC.pl - Ogólny Serwer Minecraft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #fff; text-align: center; }
        header { padding: 60px 20px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1000') center/cover; }
        h1 { font-size: 3.5rem; color: #55ff55; text-shadow: 2px 2px #000; margin-bottom: 10px; }
        p { font-size: 1.3rem; color: #ccc; margin-bottom: 20px; }
        
        .btn-container { margin: 30px 0; }
        .btn { display: inline-block; padding: 15px 30px; margin: 10px; background: #55ff55; color: #000; text-decoration: none; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; font-size: 1.1rem; transition: 0.3s; }
        .btn:hover { background: #33cc33; transform: scale(1.05); }
        .btn-discord { background: #5865F2; color: #fff; }
        .btn-discord:hover { background: #4752C4; }

        .dynmap-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        iframe { width: 100%; height: 600px; border: 2px solid #333; border-radius: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>EDENMC.PL</h1>
        <p>Witaj na oficjalnej stronie serwera! Dołącz do wspólnej gry.</p>
        
        <div class="btn-container">
            <button class="btn" onclick="copyIP()">Kopiuj IP: edenmc.pl</button>
            <a href="https://discord.gg/TWÓJ_LINK" target="_blank" class="btn btn-discord">Dołącz na Discorda</a>
        </div>
    </header>

    <div class="dynmap-container">
        <h2>Mapa Serwera na żywo</h2>
        <br>
        <!-- Tutaj podepniemy Twoją dynmapę -->
        <iframe src="http://TWOJE-IP-SERWERA:8123/"></iframe>
    </div>

    <script>
        function copyIP() {
            navigator.clipboard.writeText("edenmc.pl");
            alert("Skopiowano IP: edenmc.pl!");
        }
    </script>
</body>
</html>
