<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdenMC.pl - Serwer Minecraft</title>
    <!-- Czcionka stylizowana na pikselową / minecraftową -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* Tło strony - ciemne z fioletową łuną */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0a14;
            background-image: radial-gradient(circle at 50% 20%, #22123b 0%, #0d0a14 70%);
            font-family: 'Press Start 2P', monospace, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Górny pasek nawigacyjny */
        header {
            width: 100%;
            padding: 30px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kontener na logo i przycisk */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1200px;
            width: 100%;
        }

        /* Fioletowe logo Minecraftowe z efektem 3D */
        .logo-minecraft {
            font-size: 38px;
            font-weight: bold;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Cień daje efekt głębi/klocka jak w Minecraft */
            text-shadow: 
                4px 4px 0px #4c1d95,
                7px 7px 0px #1e1b4b,
                0px 0px 25px rgba(192, 132, 252, 0.6);
            transition: transform 0.2s ease;
            user-select: none;
        }

        .logo-minecraft:hover {
            transform: scale(1.03);
        }

        /* Minecraftowy przycisk Discorda */
        .btn-discord {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: #5865F2;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            padding: 14px 22px;
            
            /* Stylizacja na przycisk Minecrafta (ramki i cień) */
            border: 3px solid #7983f5;
            border-bottom-color: #3b44b8;
            border-right-color: #3b44b8;
            box-shadow: 
                inset -3px -3px 0px #2e3599,
                inset 3px 3px 0px #8e96f8,
                3px 3px 0px #000000;
            
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn-discord:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
            box-shadow: 
                inset -3px -3px 0px #22297d,
                inset 3px 3px 0px #7983f5,
                3px 5px 0px #000000;
        }

        .btn-discord:active {
            transform: translateY(2px);
            box-shadow: 
                inset 3px 3px 0px #22297d,
                1px 1px 0px #000000;
        }

        /* Ikona Discorda SVG */
        .discord-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* RWD - Dostosowanie na telefony */
        @media (max-width: 600px) {
            .logo-minecraft {
                font-size: 26px;
            }
            .header-container {
                gap: 20px;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <!-- Fioletowy napis Minecraft -->
            <div class="logo-minecraft">EDENMC.PL</div>

            <!-- Przycisk do Discorda (Zastąp "TWOJ-LINK" swoim zaproszeniem) -->
            <a href="https://discord.gg/https://discord.gg/B8DGTpwaSR" target="_blank" class="btn-discord">
                <svg class="discord-icon" viewBox="0 0 127.14 96.36">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0, -3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74C48.86,40.24,54,45.92,53.88,53,53.88,60,48.8,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74C91.14,40.24,96.28,45.92,96.16,53,96.16,60,91.14,65.69,84.69,65.69Z"/>
                </svg>
                <span>DISCORD</span>
            </a>
        </div>
    </header>

</body>
</html>
